<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Forgot Password</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(to right, #00b09b, #96c93d);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .form-box {
      background: white;
      padding: 30px;
      border-radius: 10px;
      width: 90%;
      max-width: 400px;
      box-shadow: 0 0 20px rgba(0,0,0,0.2);
    }
    .form-box h2 {
      text-align: center;
      margin-bottom: 20px;
    }
    input, button {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 16px;
    }
    button {
      background: #28a745;
      color: white;
      border: none;
      cursor: pointer;
      transition: 0.3s;
    }
    button:hover {
      background: #218838;
    }
    .note {
      text-align: center;
      margin-top: 15px;
      font-size: 14px;
      color: #666;
    }
  </style>
</head>
<body>
  <div class="form-box">
    <h2>Reset Your Password</h2>
    <input type="email" placeholder="Enter your email address" id="resetEmail" required>
    <button onclick="resetPassword()">Send Reset Link</button>
    <div class="note">We'll send you an email with password reset instructions.</div>
  </div>

  <script>
    function resetPassword() {
      const email = document.getElementById("resetEmail").value;
      if (!email.endsWith("@gmail.com")) {
        alert("Only Gmail addresses are supported.");
        return;
      }
      alert("A password reset link has been sent to your email.");
      window.location.href = "index.html";
    }
  </script>
</body>
</html>
