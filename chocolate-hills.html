<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>About Chocolate Hills of Bohol</title>
  <script>
    if (localStorage.getItem("isLoggedIn") !== "true") {
      window.location.href = "index.html";
    }
  </script>
  <style>
    :root {
      --primary-color: #ff9800;
      --accent-color: #5d4037;
      --bg-color: #f3f4f6;
      --text-color: #333;
      --white: #fff;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: var(--bg-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .card {
      position: relative;
      width: 90%;
      max-width: 800px;
      background-color: var(--white);
      border: 2px solid var(--accent-color);
      border-radius: 16px;
      box-shadow: 0 15px 30px rgba(0, 0, 0, 0.1);
      padding: 40px 30px;
      text-align: center;
    }

    .card h1 {
      font-size: 32px;
      color: var(--accent-color);
      margin-bottom: 25px;
    }

    .highlight {
      color: var(--primary-color);
    }

    .card img {
      width: 100%;
      max-height: 400px;
      border-radius: 12px;
      object-fit: cover;
      margin-bottom: 25px;
    }

    .card p {
      font-size: 17px;
      line-height: 1.8;
      color: var(--text-color);
      margin-bottom: 30px;
    }

    .logout-btn,
    .back-btn {
      position: absolute;
      font-size: 12px;
      font-weight: 600;
      padding: 6px 12px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .logout-btn {
      bottom: 20px;
      right: 20px;
      background-color: var(--primary-color);
      color: var(--white);
    }

    .logout-btn:hover {
      background-color: #fb8c00;
    }

    .back-btn {
      top: 10px;
      left: 10px;
      background-color: var(--primary-color);
      color: var(--white);
      font-size: 14px;
    }

    .back-btn:hover {
      background-color: #fb8c00;
    }
  </style>
</head>
<body>
  <div class="card">
    <button class="back-btn" onclick="goBack()">↩️</button>
    <h1>About <span class="highlight">Chocolate Hills</span></h1>
    <img src="choco1.jpeg" alt="Chocolate Hills of Bohol" />
    <p>
      The Chocolate Hills are a geological formation in Bohol province. There are at least 1,260 hills, but there may be as many as 1,776 spread over an area of more than 50 square kilometers. During the dry season, the grass-covered hills turn brown, hence the name.
    </p>
    <button class="logout-btn" onclick="logout()">Exit / Logout</button>
  </div>

  <script>
    function logout() {
      localStorage.removeItem("isLoggedIn");
      window.location.href = "index.html";
    }

    function goBack() {
      window.location.href = "home.html";
    }
  </script>
</body>
</html>
